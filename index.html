<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#0f172a" />
<title>Roncato</title>
<!-- An internal tool. Not a security boundary — the backend is — but there is no
     reason for a search engine to hold a copy. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<!-- The Lark JSSDK. Without it window.h5sdk never exists, the passwordless
     exchange never runs, and the app tells everyone to open it in Lark while
     they are already in Lark. -->
<script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.26.js"></script>
<style>
:root{
  --bg:#f4f5f7; --paper:#fff; --ink:#101828; --ink2:#475467; --muted:#667085;
  --line:#e4e7ec; --line2:#f2f4f7;
  --brand:#b4232c; --brand-soft:#fdf0f1;
  --ok:#067647; --ok-soft:#ecfdf3;
  --warn:#b54708; --warn-soft:#fffaeb;
  --wait:#363f72; --wait-soft:#eef4ff;
  --tap:48px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0e14; --paper:#141922; --ink:#e7eaf0; --ink2:#aab3c0; --muted:#8b95a5;
    --line:#232a36; --line2:#1b212b; --brand:#f2555f; --brand-soft:#2a1417;
    --ok:#5fd6a0; --ok-soft:#10241b; --warn:#f0b357; --warn-soft:#251a0c;
    --wait:#9db2f5; --wait-soft:#151b2e; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* A class that sets display beats the browser's own [hidden] rule on
   specificity, so hiding by attribute silently stops working. Stated once here
   rather than remembered at each element. */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0}

/* ── boot & top bar ─────────────────────────────────────── */
.boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
.boot p{color:var(--muted);max-width:30ch;margin:12px auto 0}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}

header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;font-weight:680;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.who b{display:block;color:var(--ink2);font-weight:600}

main{padding:14px 14px 24px;max-width:760px;margin:0 auto}

/* ── cards ──────────────────────────────────────────────── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:10px}
.card h3{font-size:15px;font-weight:660;margin-bottom:2px}
.sub{color:var(--muted);font-size:13px}
.rowline{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}

.count{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.count .c{flex:1 1 130px;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px}
.count .c b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.count .c span{font-size:12px;color:var(--muted)}

/* Not nowrap: a pill listing every flow a gap blocks is longer than a phone is
   wide, and clipping it hides exactly the part that says what is at stake. */
.pill{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:640;
  background:var(--line2);color:var(--ink2);max-width:100%;white-space:normal;
  overflow-wrap:anywhere}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.bad{background:var(--brand-soft);color:var(--brand)}

/* An exception is never a red dot: problem, why, owner, and one button. */
.exc{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:12px;padding:13px 14px;margin-bottom:10px}
.exc b{display:block;font-size:14.5px;margin-bottom:3px}
.exc .why{color:var(--muted);font-size:13px;margin-bottom:8px}
.exc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-width:0}

.btn{display:block;width:100%;min-height:var(--tap);border-radius:11px;border:1px solid var(--line);
  background:var(--paper);font-weight:640;padding:12px 14px;cursor:pointer;margin-top:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55}
.btn.blocked{border-style:dashed;color:var(--muted);cursor:default}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-top:8px}

.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;font-weight:640}
.err{background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:12px 14px;
  margin-bottom:10px;font-size:13.5px}

.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--line2),var(--line),var(--line2));
  background-size:200% 100%;animation:sk 1.2s ease-in-out infinite;margin-bottom:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── module grid ────────────────────────────────────────── */
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:14px;min-height:var(--tap);text-align:left;cursor:pointer}
.mod b{display:block;font-size:14.5px;font-weight:640;margin-bottom:4px}
.mod small{color:var(--muted);font-size:12px}
.mod.waiting{border-style:dashed}
.mod.waiting b{color:var(--ink2)}

/* ── timeline ───────────────────────────────────────────── */
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:4px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;
  border-radius:50%;background:var(--line);border:2px solid var(--paper)}
.tl li.done::before{background:var(--ok)}
.tl b{font-size:14px;font-weight:620}
.tl span{display:block;color:var(--muted);font-size:12.5px}

/* ── bottom tabs ────────────────────────────────────────── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;min-height:var(--tap);border:0;background:transparent;border-radius:10px;
  font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px}
nav button .g{font-size:18px;line-height:1}
nav button.on{color:var(--brand);background:var(--brand-soft)}

form label{display:block;font-weight:620;font-size:13.5px;margin:12px 0 5px}
form input,form select,form textarea{width:100%;min-height:var(--tap);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;background:var(--paper);color:var(--ink);font:inherit}
form textarea{min-height:88px}
/* A search box outside a form still has to be tappable at the same size as one
   inside it; the identity queue is used on a phone. */
.btnrow input{flex:1;min-height:var(--tap);border:1px solid var(--line);
  border-radius:10px;padding:0 12px;font:inherit;background:var(--card);color:var(--ink)}
.hint{font-weight:400;color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:13px 15px;border-radius:12px;z-index:9;
  font-size:14px;box-shadow:0 10px 30px #0004}
.back{border:0;background:transparent;padding:6px 8px 6px 0;font-size:15px;font-weight:620;
  color:var(--brand);cursor:pointer;min-height:40px}
</style>
</head>
<body>

<div id="boot" class="boot">
  <div>
    <div class="spin" id="bootSpin"></div>
    <h2 id="bootTitle">正在通过 Lark 识别身份…</h2>
    <p id="bootText">从 Lark 打开时会自动登录，不需要输入任何东西。</p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <button class="back" id="back" hidden>‹ 返回</button>
    <h1 id="title">Roncato</h1>
    <div class="who"><b id="whoName">—</b><span id="whoRole">—</span></div>
  </header>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>

<script>
(function(){
"use strict";
var APP_ID = "cli_aaf31d6bd8385e15";
var TOKEN = "";
var DEV = null;
var LARK_AUTH = "https://open.larksuite.com/open-apis/authen/v1/index";
var API_BASE = "https://imctvlveatnwrajrdeje.supabase.co/functions/v1/roncato-mini-app";
var BUILD = {"version":"2026-08-27.0356","commit":"dd035da"};
var BASE = API_BASE || location.pathname.replace(/\/app\/?$/, "");

var S = { me:null, tab:null, stack:[], busy:false };

// ── plumbing ────────────────────────────────────────────
function api(method, path, body){
  return fetch(BASE + path, {
    method: method,
    headers: Object.assign({"content-type":"application/json"},
      TOKEN ? {"authorization":"Bearer " + TOKEN} : {}),
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok){
        var e = new Error((j && (j.message || j.error)) || ("HTTP " + r.status));
        e.code = j && j.code; e.status = r.status; e.detail = j && j.detail;
        throw e;
      }
      return j.data !== undefined ? j.data : j;
    });
  });
}
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){
    if(c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
function view(){ return document.getElementById("view"); }
function clear(){ var v = view(); while(v.firstChild) v.removeChild(v.firstChild); return v; }
function skeleton(n){ var v = clear(); for(var i=0;i<(n||3);i++) v.appendChild(el("div",{class:"skel"})); }
function toast(msg){
  var t = el("div",{class:"toast"},[msg]);
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}
function fail(err){
  var v = clear();
  v.appendChild(el("div",{class:"err"},[
    err.status === 403
      ? (err.message || "你没有这项权限。")
      : (err.message || "出了点问题，请稍后再试。")
  ]));
  if(err.detail && err.detail.required){
    v.appendChild(el("div",{class:"sub"},["需要：" + err.detail.required.join(" 或 ")]));
  }
  v.appendChild(el("button",{class:"btn ghost", onclick:function(){ render(); }},["重试"]));
}
function human(s){ return String(s||"").toLowerCase().replace(/_/g," "); }

// ── login ───────────────────────────────────────────────
function exchange(code, onFail){
  api("POST","/api/lark-login",{ code: code }).then(function(d){
    TOKEN = d.session_token; start();
  }).catch(function(e){
    onFail(e);
  });
}

/**
 * Two ways in, because there are two places this page runs.
 *
 * Inside the Lark client the JSSDK is injected and hands over a code without
 * anybody typing anything. Opened from Lark web, the app arrives in an ordinary
 * browser tab with no SDK at all — and that is not an edge case, it is how every
 * desktop user who lives in the browser will meet it. Telling them to "open it
 * in Lark" while they are in Lark is the kind of message people give up on.
 *
 * So the browser case redirects through Lark's own authorisation page and comes
 * back with a code in the query string. Different journey, same exchange, same
 * server-side session: identity is still Lark's to assert and ours to verify.
 */
function boot(){
  // The persona picker is not a runtime branch — it is not in this file at all
  // unless the server asked for it. A production page therefore contains no code
  // that can sign in as somebody else, rather than containing code that declines
  // to. Dead impersonation code is the kind that stops being dead after one
  // refactor.
  if(typeof pickPersona === "function"){ return pickPersona(); }
  if(TOKEN) return start();

  var q = new URLSearchParams(location.search);
  var back = q.get("code");
  if(back){
    // Take the code out of the address bar before anything else. A single-use
    // code sitting in history, or in a link somebody pastes, is a code somebody
    // else can try.
    history.replaceState(null, "", location.pathname + location.hash);
    return exchange(back, function(e){
      bootFail("登录没有完成", e.message || "请回到 Lark 重新打开一次。");
    });
  }

  if(window.h5sdk && window.tt){
    return window.h5sdk.ready(function(){
      window.tt.requestAccess({
        appID: APP_ID, scopeList: [],
        success: function(res){
          exchange(res.code, function(e){
            bootFail("还没有你的账号", e.message || "请让 HR 把你加进员工主档。");
          });
        },
        fail: function(){ redirectToLark(); }
      });
    });
  }
  redirectToLark();
}

function redirectToLark(){
  document.getElementById("bootTitle").textContent = "正在跳转到 Lark 登录…";
  document.getElementById("bootText").textContent = "跳转后会自动回到这里。";
  var here = location.origin + location.pathname;
  location.replace(LARK_AUTH + "?app_id=" + encodeURIComponent(APP_ID)
    + "&redirect_uri=" + encodeURIComponent(here)
    + "&state=" + encodeURIComponent(location.hash.replace("#","") || "MY_WORK"));
}

function bootFail(title, text){
  document.getElementById("bootSpin").hidden = true;
  document.getElementById("bootTitle").textContent = title;
  document.getElementById("bootText").textContent = text;
}
function start(){
  api("GET","/api/me").then(function(me){
    S.me = me;
    document.getElementById("boot").hidden = true;
    document.getElementById("app").hidden = false;
    document.getElementById("whoName").textContent = me.principal_id;
    document.getElementById("whoRole").textContent =
      me.roles.length ? me.roles.map(human).join(" · ") : "员工";
    document.getElementById("whoName").title =
      "build " + (BUILD.version || "?") + " · " + (BUILD.commit || "?");
    if(me.tenant_mode === "MOCK"){
      // Said on every screen, not once at login. A page of invented people that
      // looks like the real thing is worse than no page.
      var bar = el("div",{class:"err",style:"margin:0;border-radius:0;text-align:center"},
        ["演示租户 · 这里的人和数据都是假的"]);
      var app = document.getElementById("app");
      app.insertBefore(bar, app.querySelector("main"));
    }
    // A workspace is addressable. Somebody can be sent straight to the screen
    // being talked about instead of "open the app, then the third tab".
    var want = (location.hash || "").replace("#","");
    var ok = me.navigation.workspaces.some(function(w){ return w.id === want; });
    S.tab = ok ? want : ((me.navigation.workspaces[0] || {}).id || "MY_WORK");
    window.addEventListener("hashchange", function(){
      var h = (location.hash || "").replace("#","");
      if(me.navigation.workspaces.some(function(w){ return w.id === h; })){
        S.tab = h; S.stack = []; tabs(); render();
      }
    });
    tabs(); render();
  }).catch(function(e){ bootFail("打不开", e.message); });
}

// ── chrome ──────────────────────────────────────────────
var GLYPH = { MY_WORK:"◎", MY_TEAM:"⛢", HR:"⚑", PAYROLL:"₩", FINANCE:"✓",
  MANAGEMENT:"◭", ADMIN:"⚙" };
function tabs(){
  var n = document.getElementById("tabs");
  n.innerHTML = "";
  S.me.navigation.workspaces.forEach(function(w){
    n.appendChild(el("button",{
      class: w.id === S.tab ? "on" : "",
      onclick: function(){
        S.tab = w.id; S.stack = [];
        if(location.hash !== "#" + w.id) history.replaceState(null,"","#" + w.id);
        tabs(); render();
      }
    },[ el("span",{class:"g"},[GLYPH[w.id] || "•"]), w.title ]));
  });
}
function push(title, fn){ S.stack.push({ title: title, fn: fn }); render(); }
function pop(){ S.stack.pop(); render(); }
function render(){
  var back = document.getElementById("back");
  if(S.stack.length){
    var top = S.stack[S.stack.length-1];
    document.getElementById("title").textContent = top.title;
    back.hidden = false; back.onclick = pop;
    return top.fn();
  }
  back.hidden = true;
  var ws = S.me.navigation.workspaces.filter(function(w){ return w.id === S.tab; })[0];
  document.getElementById("title").textContent = ws ? ws.title : "Roncato";
  ({ MY_WORK: myWork, MY_TEAM: myTeam, HR: hrTower, PAYROLL: payroll,
     FINANCE: payroll, MANAGEMENT: management, ADMIN: admin }[S.tab] || myWork)(ws);
}

function moduleGrid(ws){
  var g = el("div",{class:"mods"});
  ws.modules.forEach(function(m){
    var waiting = m.availability !== "AVAILABLE";
    g.appendChild(el("button",{
      class: "mod" + (waiting ? " waiting" : ""),
      onclick: function(){
        if(waiting) return toast(m.detail || "这一块还没连上。");
        openModule(m);
      }
    },[
      el("b",null,[m.title]),
      // An open module with an unstaffed lane still says what it cannot finish.
      // Showing only "打开" would hide the one fact somebody needs to know
      // before they start filling a queue nobody can yet approve.
      el("small",null,[ waiting ? (m.detail || "等待中")
        : ((m.waiting_lanes && m.waiting_lanes.length)
            ? ("打开 · 终审等 " + m.waiting_lanes.join("、"))
            : "打开") ])
    ]));
  });
  return g;
}

// ── my work ─────────────────────────────────────────────
// ── identity self-onboarding ────────────────────────────
//
// Every one of the 125 people on the retail floor is unlinked today, so this is
// the app's real front door. It asks for one thing, an employee number, and is
// explicit that typing it proves nothing: an administrator still has to confirm
// it. The claim never creates the mapping.
function identityClaimCard(){
  var box = el("div",{class:"card"},[]);
  function render(state){
    box.innerHTML = "";
    if(state && state.request && state.state !== "REJECTED" && state.state !== "SUPERSEDED"){
      var r = state.request;
      box.appendChild(el("h3",null,["绑定申请已提交"]));
      box.appendChild(el("div",{class:"sub"},["工号 " + r.claimed_employee_id + " · 等管理员确认"]));
      box.appendChild(el("div",{class:"meta",style:"margin-top:8px"},[
        el("span",{class:"pill wait"},[ human(r.state) ])
      ]));
      return;
    }
    box.appendChild(el("h3",null,["还没绑定你的员工档案"]));
    box.appendChild(el("div",{class:"sub"},[
      state && state.state === "REJECTED"
        ? "上一次申请没有通过，可以重新提交。"
        : "填你的员工工号，提交后由管理员确认。知道工号本身不等于身份证明。"
    ]));
    var input = el("input",{type:"text",placeholder:"员工工号",
      autocomplete:"off",spellcheck:"false",autocapitalize:"characters"});
    var msg = el("div",{class:"sub"},[]);
    var btn = el("button",{class:"btn primary",onclick:function(){
      var val = (input.value||"").trim();
      if(!val){ msg.textContent = "请先填工号。"; return; }
      btn.disabled = true; msg.textContent = "提交中…";
      api("POST","/api/my/identity-request",{claimed_employee_id:val})
        .then(function(){ return api("GET","/api/my/identity-request"); })
        .then(render)
        .catch(function(e){
          btn.disabled = false;
          msg.textContent = (e && e.message) ? e.message : "提交失败，请重试。";
        });
    }},["提交绑定申请"]);
    box.appendChild(el("div",{class:"btnrow",style:"margin-top:10px"},[ input, btn ]));
    box.appendChild(msg);
  }
  render(null);
  // Show the standing claim if there already is one, so nobody submits twice.
  api("GET","/api/my/identity-request").then(render).catch(function(){});
  return box;
}

function myWork(ws){
  skeleton(2);
  Promise.all([ api("GET","/api/my/actions"), api("GET","/api/my/requests") ])
  .then(function(r){
    var actions = r[0].actions || [], mine = r[1].requests || [];
    var v = clear();

    // Somebody signed in who is not attached to an employee record yet. This is
    // the first screen most of the retail floor will ever see — not one of them
    // has a Lark identity today — so it has to offer the next step rather than
    // state the problem and stop.
    if(S.me && S.me.in_employee_master === false) v.appendChild(identityClaimCard());

    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(actions.length)]), el("span",null,["等我处理"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(mine.length)]), el("span",null,["我提交的"]) ])
    ]));

    if(actions.length){
      v.appendChild(el("h3",{class:"sub"},["等我处理"]));
      actions.forEach(function(a){
        v.appendChild(el("div",{class:"exc"},[
          el("b",null,[ human(a.flow_code) ]),
          el("div",{class:"why"},[ (a.subject || "") + " · " + human(a.state) ]),
          el("button",{class:"btn primary", onclick:function(){
            push("处理", function(){ requestDetail(a.request_id); });
          }},[ a.actions[0].label ])
        ]));
      });
    }

function requestDetail(id){
  skeleton(2);
  api("GET","/api/requests/" + encodeURIComponent(id)).then(function(d){
    var v = clear(), st = d.status;
    v.appendChild(el("div",{class:"card"},[
      el("h3",null,[ human(st.flow_code) ]),
      el("div",{class:"sub"},[ st.headline ]),
      st.overdue ? el("span",{class:"pill warn",style:"margin-top:8px"},["已超时"]) : null
    ]));

    var acts = (d.actions || []);
    var can = acts.filter(function(a){ return a.allowed; });
    var cannot = acts.filter(function(a){ return !a.allowed; });

    can.forEach(function(a){
      v.appendChild(el("button",{
        class: "btn" + (a.event === "APPROVE" || a.event === "DECIDE_SUPERVISOR" ? " primary" : ""),
        onclick: function(){ act(id, a); }
      },[ a.label ]));
    });
    // Shown, not hidden: somebody who expected a button needs to know why it is
    // not theirs, or they refresh the page instead.
    cannot.forEach(function(a){
      v.appendChild(el("button",{class:"btn blocked", disabled:"disabled",
        title:a.reason},[ a.label + " · " + human(a.required_role) ]));
    });

    var tl = el("ul",{class:"tl"});
    (st.history || []).forEach(function(h){
      tl.appendChild(el("li",{class:"done"},[
        el("b",null,[ human(h.event) ]),
        el("span",null,[ (h.actor ? h.actor + " · " : "") + new Date(h.at).toLocaleString() ])
      ]));
    });
    v.appendChild(el("div",{class:"card"},[ el("h3",null,["经过"]), tl ]));
  }).catch(fail);
}

function act(id, a){
  if(S.busy) return;
  var evidence = [];
  if(a.requires_evidence){
    var note = window.prompt("这一步需要写明原因：");
    if(!note) return;
    evidence = [{ kind:"NOTE", ref: note }];
  }
  S.busy = true;
  api("POST","/api/requests/" + encodeURIComponent(id) + "/act", {
    event: a.event, evidence: evidence,
    idempotency_key: id + ":" + a.event + ":" + Date.now()
  }).then(function(d){
    toast(d.replayed ? "这一步刚才已经完成过了。" : "已" + a.label);
    requestDetail(id);
  }).catch(function(e){ toast(e.message || "没有成功"); })
    .then(function(){ S.busy = false; });
}

function admin(ws){
  skeleton(3);
  Promise.all([ api("GET","/api/admin/roles"), api("GET","/api/admin/flows") ])
  .then(function(r){
    var slots = r[0].slots || [], flows = r[1].flows || [];
    var sum = r[0].slot_summary || null;
    var v = clear();
    // Only slots somebody is actually expected to fill. A store that expects no
    // headcount, or that the Outlet Master never mentions, is not a task — and
    // listing every one of them is what turned this screen into 429 rows.
    var open = slots.filter(function(s){ return s.actionable; });
    var assigned = slots.filter(function(s){ return s.state === "ASSIGNED"; });

    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(open.length)]), el("span",null,["待分配"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(assigned.length)]),
        el("span",null,["已就位"]) ])
    ]));

    // Lead with the decisions. One role nobody holds anywhere is one decision
    // affecting many outlets, not many separate tasks.
    if (sum && sum.root_causes) {
      sum.root_causes.forEach(function(c){
        v.appendChild(el("div",{class:"exc"},[
          el("b",null,[ c.remedy ]),
          el("div",{class:"why"},[ c.affected_people === 1
            ? "影响 1 个范围。"
            : ("一个决定，影响 " + c.affected_people + " 个需要配人的门店。") ]),
          el("div",{class:"meta"},[ el("span",{class:"pill warn"},[ c.code ]) ])
        ]));
      });
    }

    // The denominator, written down. Without it a reader cannot tell a small
    // queue from a filtered one.
    if (sum && sum.outlet_scoped) {
      var os = sum.outlet_scoped;
      v.appendChild(el("div",{class:"card"},[
        el("h3",null,["门店角色覆盖"]),
        el("div",{class:"meta",style:"margin-top:8px"},[
          el("span",{class:"pill"},[ "该配 " + os.applicable ]),
          el("span",{class:"pill ok"},[ "已配 " + os.satisfied ]),
          el("span",{class:"pill warn"},[ "缺 " + os.missing ]),
          el("span",{class:"pill"},[ "不适用 " + os.not_applicable ]),
          el("span",{class:"pill"},[ "未知 " + os.applicability_unknown ])
        ]),
        el("div",{class:"sub"},["不适用＝该店 2026 计划人数为 0；未知＝该店不在 Outlet Master 里。两者都不是待办。"])
      ]));

    open.forEach(function(s){

        el("b",null,[ s.required_action ]),
        el("div",{class:"why"},[ s.state === "ROLE_SLOT_AMBIGUOUS"
          ? "两个人同时持有，流程会卡住。"
          : "需要这个角色的申请现在没有去处。" ]),
        s.pending_grants.length ? el("div",{class:"meta"},[
          el("span",{class:"pill wait"},[ s.pending_grants.length + " 个待审批" ])
        ]) : null,
        el("button",{class:"btn primary",onclick:function(){ assignForm(s); }},["分配"])
      ]));
    });

    // Policies sit above flow status because an unconfigured rule is something
    // somebody can act on today; flow status is a read-out.
    api("GET","/api/admin/policies").then(function(pol){
      var box = el("div",null,[ el("h3",{class:"sub",style:"margin-top:14px"},["政策"]) ]);
      pol.policies.forEach(function(p){
        box.appendChild(el("div",{class: p.blocks_output ? "exc" : "card"},[
          el("b",null,[ p.title ]),
          el("div",{class:"why"},[ p.status === "UNCONFIGURED"
            ? (p.drafts_waiting ? (p.drafts_waiting + " 个草稿等待审批")
                                : "还没有人定过这条规则")
            : ("第 " + p.version + " 版生效中") ]),
          el("div",{class:"meta"},[
            el("span",{class:"pill"},[ "负责：" + human(p.owner) ]),
            p.decision_ref ? el("span",{class:"pill warn"},[ "待裁决 " + p.decision_ref ]) : null,
            p.blocks_output ? el("span",{class:"pill warn"},["输出被挡住"]) : null
          ]),
          p.required_action ? el("div",{class:"sub"},[ p.required_action ]) : null
        ]));
      });
      // The three things that are somebody's decision, not a defect.
      box.appendChild(el("div",{class:"card"},[
        el("h3",null,["佣金"]),
        el("div",{class:"meta",style:"margin-top:8px"},[
          el("span",{class:"pill ok"},[ "框架 " + human(pol.commission.framework) ]),

      ]));
      var anchor = v.querySelector("[data-flows]");
      if(anchor) v.insertBefore(box, anchor); else v.appendChild(box);
    }).catch(function(){ /* the board is additive; its absence must not blank admin */ });

    v.appendChild(el("h3",{class:"sub",style:"margin-top:14px","data-flows":"1"},["流程状态"]));

          el("span",{class:"pill"},[ "覆盖 " + human(f.data_coverage) ]),
          el("span",{class:"pill wait"},[ human(f.live_status) ])
        ])
      ]));
    });
    v.appendChild(moduleGrid(ws));
  }).catch(fail);
}

// ── role administration ─────────────────────────────────
//
// This screen did not exist: ADMIN_ROLES opened an empty placeholder, so every
// role change needed SQL and a person who could write it. Approving was
// unreachable from the UI entirely, which meant a requested grant could be
// created and then never take effect.
//
// It leads with what is waiting on a human, then what exists and grants nothing,
// then the slots still open.
function roleAdmin(){
  skeleton(2);
  api("GET","/api/admin/roles").then(function(r){
    var slots = r.slots || [], sum = r.slot_summary || null;
    // NOT_APPROVED rows are already shown above as things waiting on a person.
    // Repeating them here as "exists but grants nothing" is true and is noise:
    // the same row twice reads as two problems.
    var un = (r.unadmitted || []).filter(function(u){ return u.reason !== "NOT_APPROVED"; });
    var v = clear();

    var pending = [];
    slots.forEach(function(s){
      (s.pending_grants||[]).forEach(function(p){
        pending.push({ slot:s, grant:p });
      });
    });
    var assigned = slots.filter(function(s){ return s.state === "ASSIGNED"; });
    var open = slots.filter(function(s){ return s.actionable; });

    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(pending.length)]), el("span",null,["等审批"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(assigned.length)]), el("span",null,["已就位"]) ])
    ]));

    // Waiting on a person. Shown first because it is the only thing here that
    // somebody can finish in one tap.
    if(pending.length){
      v.appendChild(el("h3",{class:"sub"},["等审批"]));
      pending.forEach(function(p){
        var card = el("div",{class:"exc"},[
          el("b",null,[ human(p.slot.role_code) + (p.slot.scope && p.slot.scope.outlet_code
            ? (" · " + p.slot.scope.outlet_code) : " · 全公司") ]),
          el("div",{class:"why"},[ "授予 " + p.grant.principal_id
            + (p.grant.effective_from ? ("，" + p.grant.effective_from.slice(0,10) + " 起") : "") ]),
          el("div",{class:"meta"},[ el("span",{class:"pill wait"},["PENDING"]) ])
        ]);
        if(p.grant.assignment_id){
          card.appendChild(el("button",{class:"btn primary",onclick:function(){
            api("POST","/api/admin/roles/" + encodeURIComponent(p.grant.assignment_id) + "/approve",{})
              .then(function(){ toast("已批准并写入"); roleAdmin(); })
              .catch(function(e){ toast(e.message); });
          }},["批准"]));
        }
        v.appendChild(card);
      });
    }

    // Rows that exist and confer nothing. Every assignment in this tenant is
    // currently one of these, and before it was listed the only symptom was a
    // screen that looked empty for no stated reason.
    if(un.length){
      v.appendChild(el("h3",{class:"sub",style:"margin-top:16px"},["存在但不授权"]));
      un.forEach(function(u){
        v.appendChild(el("div",{class:"card"},[
          el("b",null,[ human(u.role_code) + (u.outlet_code ? (" · " + u.outlet_code) : "") ]),
          el("div",{class:"why"},[ u.remedy ]),
          el("div",{class:"meta"},[
            el("span",{class:"pill warn"},[ u.reason ]),
            el("span",{class:"pill"},[ u.principal_id ])
          ])
        ]));
      });
      v.appendChild(el("div",{class:"sub"},
        ["这些行不会被改写。正确做法是新建一条写明 scope 的授权去取代它，而不是把旧行改成它从没说过的意思。"]));
    }

    if(assigned.length){
      v.appendChild(el("h3",{class:"sub",style:"margin-top:16px"},["已就位"]));
      assigned.forEach(function(s){
        v.appendChild(el("div",{class:"card"},[
          el("b",null,[ human(s.role_code) + (s.scope && s.scope.outlet_code
            ? (" · " + s.scope.outlet_code) : " · 全公司") ]),
          el("div",{class:"why"},[ "持有人 " + s.holder ]),
          el("button",{class:"btn ghost",onclick:function(){ assignForm(s); }},["换人"])
        ]));
      });
    }

    if(sum && sum.outlet_scoped){
      var os = sum.outlet_scoped;
      v.appendChild(el("div",{class:"card"},[
        el("h3",null,["门店角色覆盖"]),
        el("div",{class:"meta",style:"margin-top:8px"},[
          el("span",{class:"pill"},[ "该配 " + os.applicable ]),
          el("span",{class:"pill ok"},[ "已配 " + os.satisfied ]),
          el("span",{class:"pill warn"},[ "缺 " + os.missing ]),
          el("span",{class:"pill"},[ "不适用 " + os.not_applicable ]),
          el("span",{class:"pill"},[ "未知 " + os.applicability_unknown ])
        ])
      ]));
    }

    if(open.length){
      // Company-wide roles first. They are five rows against a couple of hundred
      // outlet ones, and they are the rows that unlock the rest of the app — so
      // sorting by natural order buried HR_ADMIN past a truncation limit and
      // made the one job worth doing first invisible.
      open.sort(function(a,b){
        var ag = a.scope && a.scope.outlet_code ? 1 : 0;
        var bg = b.scope && b.scope.outlet_code ? 1 : 0;
        return ag - bg;
      });
      v.appendChild(el("h3",{class:"sub",style:"margin-top:16px"},["还没有人"]));
      open.slice(0,50).forEach(function(s){
        v.appendChild(el("div",{class:"exc"},[
          el("b",null,[ s.required_action ]),
          el("button",{class:"btn primary",onclick:function(){ assignForm(s); }},["分配"])
        ]));
      });
      if(open.length > 50){
        v.appendChild(el("div",{class:"sub"},[ "另外还有 " + (open.length-50) + " 个，先处理上面的根因。" ]));
      }
    }

    v.appendChild(el("button",{class:"btn ghost",style:"margin-top:16px",onclick:pop},["返回"]));
  }).catch(fail);
}

function assignForm(slot){
  push("分配 " + human(slot.role_code), function(){
    var v = clear();
    v.appendChild(el("div",{class:"sub",style:"margin-bottom:6px"},[
      slot.scope.outlet_code ? ("门店 " + slot.scope.outlet_code) : "全公司"
    ]));
    var f = el("form",{onsubmit:function(ev){
      ev.preventDefault();
      var fd = new FormData(f);
      api("POST","/api/admin/roles",{
        role_code: slot.role_code,
        principal_id: fd.get("who"),
        scope: slot.scope.outlet_code ? { outlet_code: slot.scope.outlet_code }
          : { type:"GLOBAL" },
        effective_from: new Date(fd.get("from")).toISOString(),
        reason: fd.get("reason") || null
      }).then(function(){
        toast("已提交，等别人审批后生效");
        pop();
      }).catch(function(e){ toast(e.message); });
    }},[
      el("label",null,["谁", el("span",{class:"hint"},["员工编号"])]),
      el("input",{name:"who",required:"required",placeholder:"E-1002"}),
      el("label",null,["从哪天起"]),
      el("input",{name:"from",type:"date",required:"required",
        value:new Date().toISOString().slice(0,10)}),
      el("label",null,["原因"]),
      el("input",{name:"reason",placeholder:"新店开业 / 交接"}),
      el("button",{class:"btn primary",type:"submit"},["提交"]),
      el("div",{class:"sub",style:"margin-top:10px"},
        ["提交后不会立刻生效：必须由另一个人审批，你不能批自己提的。"])
    ]);
    v.appendChild(f);
  });
}

// ── Identity administration ──────────────────────────────────────────
//
// The screen that turns "a new person joined" into configuration instead of a
// development task. It shows one page at a time on purpose: 584 rows in a
// browser is both a slow screen and a copy of the employee master sitting in
// somebody's tab.

var IDQ = { offset: 0, limit: 25, q: "", link: "" };

// Everything waiting on an independent verifier, and who that has to be.
//
// Appended asynchronously so the identity screen renders at once; a queue that
// is usually empty should never delay the page that is usually the point.
function verificationLane(v){
  var box = el("div",{class:"card"},[]);
  v.appendChild(box);
  api("GET","/api/admin/identity/requests?state=SUBMITTED").then(function(r){
    var rows = (r && r.requests) || [];
    var lanes = (S.me && S.me.navigation) ? (function(){
      var out = [];
      (S.me.navigation.workspaces||[]).forEach(function(w){
        (w.modules||[]).forEach(function(m){
          if(m.id === "ADMIN_IDENTITY" && m.waiting_lanes) out = m.waiting_lanes;
        });
      });
      return out;
    })() : [];

    box.innerHTML = "";
    box.appendChild(el("h3",null,["待核验"]));
    box.appendChild(el("div",{class:"sub"},[
      rows.length ? (rows.length + " 条绑定申请等待独立核验。")
        : "现在没有待核验的绑定申请。" ]));
    if(lanes.length){
      box.appendChild(el("div",{class:"meta",style:"margin-top:8px"},[
        el("span",{class:"pill warn"},[ "等 " + lanes.join("、") + " 上任" ])
      ]));
      box.appendChild(el("div",{class:"sub"},[
        "你可以提出绑定申请，但不能自己终审。提出人和核验人必须是两个人。" ]));
    }
    rows.slice(0,10).forEach(function(q){
      box.appendChild(el("div",{class:"exc"},[
        el("b",null,[ "工号 " + q.claimed_employee_id
          + (q.employee_display_name ? ("（" + q.employee_display_name + "）") : "") ]),
        el("div",{class:"why"},[
          q.employee_exists ? ("在职状态 " + (q.employment_status || "未知"))
            : "这个工号在花名册里找不到" ]),
        el("div",{class:"meta"},[
          q.claimed_employee_already_linked
            ? el("span",{class:"pill warn"},["该员工已绑定其他账号"]) : null,
          q.signer_already_linked_to
            ? el("span",{class:"pill warn"},["该账号已绑到 " + q.signer_already_linked_to]) : null,
          el("span",{class:"pill wait"},[ q.state ])
        ])
      ]));
    });
  }).catch(function(){ box.innerHTML = ""; });
}

function identityAdmin(){
  skeleton(3);
  var qs = "?limit=" + IDQ.limit + "&offset=" + IDQ.offset
    + (IDQ.q ? "&q=" + encodeURIComponent(IDQ.q) : "")
    + (IDQ.link ? "&link=" + encodeURIComponent(IDQ.link) : "");
  api("GET","/api/admin/identity" + qs).then(function(r){
    var v = clear();
    if(r.configured === false){
      v.appendChild(el("div",{class:"empty"},[
        el("b",null,["还没有已发布的花名册"]),
        "先完成一次 Employee Master 同步。" ]));
      return;
    }
    var s = r.summary;

    // Four counts, never one percentage. "Linked" and "can actually sign in"
    // are different questions and the gap between them is the work.
    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(s.active_employees)]), el("span",null,["在职"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(s.interactive_ready)]), el("span",null,["可登录"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(s.unlinked)]), el("span",null,["未绑定"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(s.conflict)]), el("span",null,["冲突"]) ])
    ]));

    // The verification lane, stated rather than implied.
    //
    // HR_ADMIN can work this whole screen; what it cannot do is sign off its own
    // consequential binding. Before this said so, an empty HR_VERIFIER slot just
    // locked the module and gave nobody a way to find out why.
    verificationLane(v);

    if(s.linked_but_unreachable > 0){
      v.appendChild(el("div",{class:"exc"},[
        el("b",null,[ s.linked_but_unreachable + " 人已绑定但本应用认不出" ]),
        el("div",{class:"why"},[
          "他们的记录来自别的 Lark 应用，本应用登录时拿到的是另一个 open_id。" +
          "等他们打开一次本应用再重新绑定即可。" ]),
        el("button",{class:"btn ghost",onclick:function(){
          IDQ.link = "UNREACHABLE"; IDQ.offset = 0; identityAdmin(); }},["只看这些人"])
      ]));
    }

    var bar = el("div",{class:"btnrow"},[
      el("input",{placeholder:"搜工号",value:IDQ.q,oninput:function(e){
        IDQ.q = e.target.value; }}),
      el("button",{class:"btn ghost",onclick:function(){ IDQ.offset = 0; identityAdmin(); }},["搜索"])
    ]);
    v.appendChild(bar);

    var filters = el("div",{class:"meta"},[]);
    [["","全部"],["NOT_LINKED","未绑定"],["LINKED","已绑定"],
     ["UNREACHABLE","认不出"],["CONFLICT","冲突"]].forEach(function(f){
      filters.appendChild(el("span",{
        class:"pill" + (IDQ.link === f[0] ? " ok" : ""),
        onclick:function(){ IDQ.link = f[0]; IDQ.offset = 0; identityAdmin(); }},[ f[1] ]));
    });
    v.appendChild(filters);

    if(r.items.length === 0){
      v.appendChild(el("div",{class:"empty"},[ el("b",null,["没有符合条件的人"]), "" ]));
    }
    r.items.forEach(function(i){
      v.appendChild(el("div",{class: i.link_state === "CONFLICT" ? "exc" : "card",
        onclick:function(){ identityDetail(i.employee_id); }},[
        el("b",null,[ i.employee_id + (i.display_name ? " · " + i.display_name : "") ]),
        el("div",{class:"meta"},[
          el("span",{class:"pill " + (i.interactive_ready ? "ok" : "warn")},[
            i.link_state === "CONFLICT" ? "冲突"
              : i.interactive_ready ? "可登录"
              : i.link_state === "LINKED" ? "认不出" : "未绑定" ]),
          i.department ? el("span",{class:"pill"},[ i.department ]) : null,
          i.position ? el("span",{class:"pill"},[ i.position ]) : null
        ]),
        i.reason ? el("div",{class:"why"},[ i.reason ]) : null
      ]));
    });

    var nav = el("div",{class:"btnrow"},[
      IDQ.offset > 0 ? el("button",{class:"btn ghost",onclick:function(){
        IDQ.offset = Math.max(0, IDQ.offset - IDQ.limit); identityAdmin(); }},["上一页"]) : null,
      r.items.length >= IDQ.limit ? el("button",{class:"btn ghost",onclick:function(){
        IDQ.offset += IDQ.limit; identityAdmin(); }},["下一页"]) : null
    ]);
    v.appendChild(nav);
  }).catch(fail);
}

function identityDetail(employeeId){
  push(employeeId, function(){
    skeleton(2);
    api("GET","/api/admin/identity/" + encodeURIComponent(employeeId)).then(function(r){
      var v = clear();
      var c = r.current;
      v.appendChild(el("div",{class:"card"},[
        el("b",null,[ employeeId ]),
        el("div",{class:"meta"},[
          el("span",{class:"pill " + (c.interactive_ready ? "ok" : "warn")},[
            human(c.state) ]),
          (c.namespaces || []).length
            ? el("span",{class:"pill"},[ c.namespaces.join(", ") ]) : null
        ]),
        c.reason ? el("div",{class:"why"},[ c.reason ]) : null
      ]));

      v.appendChild(el("h3",{class:"sub",style:"margin-top:14px"},["历史"]));
      if(r.history.length === 0){
        v.appendChild(el("div",{class:"empty"},[ el("b",null,["还没有任何绑定记录"]), "" ]));
      }
      r.history.forEach(function(h){
        v.appendChild(el("div",{class:"card"},[
          el("b",null,[ (h.valid_from || "?") + " → " + (h.valid_to || "至今") ]),
          el("div",{class:"meta"},[
            el("span",{class:"pill " + (h.current ? "ok" : "")},[ h.current ? "生效中" : "已结束" ]),
            el("span",{class:"pill"},[ h.app_code || "?" ]),
            // Which key, never its value. A screenshot of an open_id outlives
            // the screen it was taken from.
            el("span",{class:"pill"},[ (h.keys || []).join(", ") || "—" ])
          ]),
          h.reason ? el("div",{class:"why"},[ h.reason ]) : null
        ]));
      });

      v.appendChild(el("div",{class:"card",style:"margin-top:14px"},[
        el("b",null,["怎么绑定"]),
        el("div",{class:"why"},[
          "让这位员工自己在 Lark 里打开一次本应用并提交「这是我」，" +
          "由管理员确认后生效。这样 Lark 自己验证了身份，" +
          "而确认那一步是人做的决定。" ]),
        el("div",{class:"sub"},[ "系统不会按姓名或邮箱自动配对。" ])
      ]));
      v.appendChild(el("button",{class:"btn ghost",onclick:pop},["返回"]));
    }).catch(fail);
  });
}

// ── Configuration suggestions ────────────────────────────────────────

function suggestions(){
  skeleton(3);
  Promise.all([ api("GET","/api/admin/suggestions?limit=25") ]).then(function(res){
    var r = res[0], v = clear();
    var counts = r.counts || {};
    var row = el("div",{class:"count"},[]);
    Object.keys(counts).forEach(function(k){
      row.appendChild(el("div",{class:"c"},[
        el("b",null,[ String(counts[k].PROPOSED || 0) ]),
        el("span",null,[ human(k) ]) ]));
    });
    v.appendChild(row);

    v.appendChild(el("div",{class:"card"},[
      el("b",null,["这些只是建议"]),
      el("div",{class:"why"},[ r.note ])
    ]));

    r.items.forEach(function(c){
      v.appendChild(el("div",{class:"card"},[
        el("b",null,[ c.employee_id || c.supervisor_employee_id || c.outlet_code || "?" ]),
        el("div",{class:"meta"},[
          el("span",{class:"pill"},[ human(c.kind) ]),
          c.outlet_code ? el("span",{class:"pill"},[ c.outlet_code ]) : null,
          c.role_hint ? el("span",{class:"pill"},[ c.role_hint ]) : null,
          el("span",{class:"pill"},[ human(c.confidence) ])
        ]),
        el("div",{class:"why"},[ c.reason ]),
        c.kind === "SUPERVISOR_TERRITORY"
          ? el("div",{class:"sub"},["接受只会生成角色提议，不会授予督导权限。"]) : null,
        el("div",{class:"btnrow"},[
          el("button",{class:"btn primary",onclick:function(){
            reviewCandidate(c.candidate_id, "ACCEPTED"); }},["接受"]),
          el("button",{class:"btn ghost",onclick:function(){
            reviewCandidate(c.candidate_id, "REJECTED"); }},["拒绝"])
        ])
      ]));
    });
  }).catch(fail);
}

function reviewCandidate(id, decision){
  api("POST","/api/admin/suggestions/" + encodeURIComponent(id) + "/review",
    { decision: decision }).then(function(r){
      toast(decision === "ACCEPTED" ? "已接受（未授予任何权限）" : "已拒绝");
      suggestions();
    }).catch(fail);
}

// ── System connections ───────────────────────────────────────────────

function connections(){
  skeleton(3);
  api("GET","/api/admin/connections").then(function(r){
    var v = clear();
    r.connections.forEach(function(c){
      var ok = c.status === "CONNECTED";
      v.appendChild(el("div",{class: ok ? "card" : "exc"},[
        el("b",null,[ human(c.system) ]),
        el("div",{class:"meta"},[
          el("span",{class:"pill " + (ok ? "ok" : "warn")},[ human(c.status) ]),
          c.last_verified ? el("span",{class:"pill"},[ "核对于 " + c.last_verified ]) : null
        ]),
        c.evidence ? el("div",{class:"why"},[ c.evidence ]) : null
      ]));
    });
    v.appendChild(el("div",{class:"sub",style:"margin-top:10px"},[ r.note ]));
  }).catch(fail);
}

var SCREENS = {
  ADMIN_IDENTITY: identityAdmin,
  ADMIN_ROLES: roleAdmin,
  ADMIN_SUGGESTIONS: suggestions,
  ADMIN_CONNECTIONS: connections
};

function openModule(m){
  var screen = SCREENS[m.id];
  if(screen){ push(m.title, screen); return; }
  push(m.title, function(){
    var v = clear();
    v.appendChild(el("div",{class:"empty"},[
      el("b",null,[m.title]),
      m.flow ? ("这一块属于 " + human(m.flow) + "。") : "",
    ]));
    v.appendChild(el("button",{class:"btn ghost",onclick:pop},["返回"]));
  });
}

boot();
})();
</script>
