<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#0f172a" />
<title>Roncato</title>
<!-- An internal tool. Not a security boundary — the backend is — but there is no
     reason for a search engine to hold a copy. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<!-- The Lark JSSDK. Without it window.h5sdk never exists, the passwordless
     exchange never runs, and the app tells everyone to open it in Lark while
     they are already in Lark. -->
<script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.26.js"></script>
<style>
:root{
  --bg:#f4f5f7; --paper:#fff; --ink:#101828; --ink2:#475467; --muted:#667085;
  --line:#e4e7ec; --line2:#f2f4f7;
  --brand:#b4232c; --brand-soft:#fdf0f1;
  --ok:#067647; --ok-soft:#ecfdf3;
  --warn:#b54708; --warn-soft:#fffaeb;
  --wait:#363f72; --wait-soft:#eef4ff;
  --tap:48px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0e14; --paper:#141922; --ink:#e7eaf0; --ink2:#aab3c0; --muted:#8b95a5;
    --line:#232a36; --line2:#1b212b; --brand:#f2555f; --brand-soft:#2a1417;
    --ok:#5fd6a0; --ok-soft:#10241b; --warn:#f0b357; --warn-soft:#251a0c;
    --wait:#9db2f5; --wait-soft:#151b2e; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* A class that sets display beats the browser's own [hidden] rule on
   specificity, so hiding by attribute silently stops working. Stated once here
   rather than remembered at each element. */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0}

/* ── boot & top bar ─────────────────────────────────────── */
.boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
.boot p{color:var(--muted);max-width:30ch;margin:12px auto 0}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}

header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;font-weight:680;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.who b{display:block;color:var(--ink2);font-weight:600}

main{padding:14px 14px 24px;max-width:760px;margin:0 auto}

/* ── cards ──────────────────────────────────────────────── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:10px}
.card h3{font-size:15px;font-weight:660;margin-bottom:2px}
.sub{color:var(--muted);font-size:13px}
.rowline{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}

.count{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.count .c{flex:1 1 130px;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px}
.count .c b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.count .c span{font-size:12px;color:var(--muted)}

/* Not nowrap: a pill listing every flow a gap blocks is longer than a phone is
   wide, and clipping it hides exactly the part that says what is at stake. */
.pill{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:640;
  background:var(--line2);color:var(--ink2);max-width:100%;white-space:normal;
  overflow-wrap:anywhere}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.bad{background:var(--brand-soft);color:var(--brand)}

/* An exception is never a red dot: problem, why, owner, and one button. */
.exc{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:12px;padding:13px 14px;margin-bottom:10px}
.exc b{display:block;font-size:14.5px;margin-bottom:3px}
.exc .why{color:var(--muted);font-size:13px;margin-bottom:8px}
.exc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-width:0}

.btn{display:block;width:100%;min-height:var(--tap);border-radius:11px;border:1px solid var(--line);
  background:var(--paper);font-weight:640;padding:12px 14px;cursor:pointer;margin-top:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55}
.btn.blocked{border-style:dashed;color:var(--muted);cursor:default}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-top:8px}

.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;font-weight:640}
.err{background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:12px 14px;
  margin-bottom:10px;font-size:13.5px}

.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--line2),var(--line),var(--line2));
  background-size:200% 100%;animation:sk 1.2s ease-in-out infinite;margin-bottom:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── module grid ────────────────────────────────────────── */
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:14px;min-height:var(--tap);text-align:left;cursor:pointer}
.mod b{display:block;font-size:14.5px;font-weight:640;margin-bottom:4px}
.mod small{color:var(--muted);font-size:12px}
.mod.waiting{border-style:dashed}
.mod.waiting b{color:var(--ink2)}

/* ── timeline ───────────────────────────────────────────── */
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:4px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;
  border-radius:50%;background:var(--line);border:2px solid var(--paper)}
.tl li.done::before{background:var(--ok)}
.tl b{font-size:14px;font-weight:620}
.tl span{display:block;color:var(--muted);font-size:12.5px}

/* ── bottom tabs ────────────────────────────────────────── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;min-height:var(--tap);border:0;background:transparent;border-radius:10px;
  font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px}
nav button .g{font-size:18px;line-height:1}
nav button.on{color:var(--brand);background:var(--brand-soft)}

form label{display:block;font-weight:620;font-size:13.5px;margin:12px 0 5px}
form input,form select,form textarea{width:100%;min-height:var(--tap);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;background:var(--paper);color:var(--ink);font:inherit}
form textarea{min-height:88px}
.hint{font-weight:400;color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:13px 15px;border-radius:12px;z-index:9;
  font-size:14px;box-shadow:0 10px 30px #0004}
.back{border:0;background:transparent;padding:6px 8px 6px 0;font-size:15px;font-weight:620;
  color:var(--brand);cursor:pointer;min-height:40px}
</style>
</head>
<body>

<div id="boot" class="boot">
  <div>
    <div class="spin" id="bootSpin"></div>
    <h2 id="bootTitle">正在通过 Lark 识别身份…</h2>
    <p id="bootText">从 Lark 打开时会自动登录，不需要输入任何东西。</p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <button class="back" id="back" hidden>‹ 返回</button>
    <h1 id="title">Roncato</h1>
    <div class="who"><b id="whoName">—</b><span id="whoRole">—</span></div>
  </header>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>

<script>
(function(){
"use strict";
var APP_ID = "cli_aaf31d6bd8385e15";
var TOKEN = "";
var DEV = null;
var API_BASE = "https://imctvlveatnwrajrdeje.supabase.co/functions/v1/roncato-mini-app";
var BUILD = {"version":"2026-08-25.1032","commit":"ad417a8"};
var BASE = API_BASE || location.pathname.replace(/\/app\/?$/, "");

var S = { me:null, tab:null, stack:[], busy:false };

// ── plumbing ────────────────────────────────────────────
function api(method, path, body){
  return fetch(BASE + path, {
    method: method,
    headers: Object.assign({"content-type":"application/json"},
      TOKEN ? {"authorization":"Bearer " + TOKEN} : {}),
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok){
        var e = new Error((j && (j.message || j.error)) || ("HTTP " + r.status));
        e.code = j && j.code; e.status = r.status; e.detail = j && j.detail;
        throw e;
      }
      return j.data !== undefined ? j.data : j;
    });
  });
}
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){
    if(c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
function view(){ return document.getElementById("view"); }
function clear(){ var v = view(); while(v.firstChild) v.removeChild(v.firstChild); return v; }
function skeleton(n){ var v = clear(); for(var i=0;i<(n||3);i++) v.appendChild(el("div",{class:"skel"})); }
function toast(msg){
  var t = el("div",{class:"toast"},[msg]);
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}
function fail(err){
  var v = clear();
  v.appendChild(el("div",{class:"err"},[
    err.status === 403
      ? (err.message || "你没有这项权限。")
      : (err.message || "出了点问题，请稍后再试。")
  ]));
  if(err.detail && err.detail.required){
    v.appendChild(el("div",{class:"sub"},["需要：" + err.detail.required.join(" 或 ")]));
  }
  v.appendChild(el("button",{class:"btn ghost", onclick:function(){ render(); }},["重试"]));
}
function human(s){ return String(s||"").toLowerCase().replace(/_/g," "); }

// ── login ───────────────────────────────────────────────
function boot(){
  // The persona picker is not a runtime branch — it is not in this file at all
  // unless the server asked for it. A production page therefore contains no code
  // that can sign in as somebody else, rather than containing code that declines
  // to. Dead impersonation code is the kind that stops being dead after one
  // refactor.
  if(typeof pickPersona === "function"){ return pickPersona(); }
  if(TOKEN) return start();
  if(!window.h5sdk || !window.tt){
    return bootFail("请在 Lark 里打开",
      "这个页面用 Lark 的免登识别你的身份，在普通浏览器里打不开。");
  }
  window.h5sdk.ready(function(){
    window.tt.requestAccess({
      appID: APP_ID, scopeList: [],
      success: function(res){
        api("POST","/api/lark-login",{ code: res.code }).then(function(d){
          TOKEN = d.session_token; start();
        }).catch(function(e){
          bootFail("还没有你的账号", e.message || "请让 HR 把你加进员工主档。");
        });
      },
      fail: function(){ bootFail("登录没有完成","请退出后重新从 Lark 打开一次。"); }
    });
  });
}

function bootFail(title, text){
  document.getElementById("bootSpin").hidden = true;
  document.getElementById("bootTitle").textContent = title;
  document.getElementById("bootText").textContent = text;
}
function start(){
  api("GET","/api/me").then(function(me){
    S.me = me;
    document.getElementById("boot").hidden = true;
    document.getElementById("app").hidden = false;
    document.getElementById("whoName").textContent = me.principal_id;
    document.getElementById("whoRole").textContent =
      me.roles.length ? me.roles.map(human).join(" · ") : "员工";
    document.getElementById("whoName").title =
      "build " + (BUILD.version || "?") + " · " + (BUILD.commit || "?");
    if(me.tenant_mode === "MOCK"){
      // Said on every screen, not once at login. A page of invented people that
      // looks like the real thing is worse than no page.
      var bar = el("div",{class:"err",style:"margin:0;border-radius:0;text-align:center"},
        ["演示租户 · 这里的人和数据都是假的"]);
      var app = document.getElementById("app");
      app.insertBefore(bar, app.querySelector("main"));
    }
    // A workspace is addressable. Somebody can be sent straight to the screen
    // being talked about instead of "open the app, then the third tab".
    var want = (location.hash || "").replace("#","");
    var ok = me.navigation.workspaces.some(function(w){ return w.id === want; });
    S.tab = ok ? want : ((me.navigation.workspaces[0] || {}).id || "MY_WORK");
    window.addEventListener("hashchange", function(){
      var h = (location.hash || "").replace("#","");
      if(me.navigation.workspaces.some(function(w){ return w.id === h; })){
        S.tab = h; S.stack = []; tabs(); render();
      }
    });
    tabs(); render();
  }).catch(function(e){ bootFail("打不开", e.message); });
}

// ── chrome ──────────────────────────────────────────────
var GLYPH = { MY_WORK:"◎", MY_TEAM:"⛢", HR:"⚑", PAYROLL:"₩", FINANCE:"✓",
  MANAGEMENT:"◭", ADMIN:"⚙" };
function tabs(){
  var n = document.getElementById("tabs");
  n.innerHTML = "";
  S.me.navigation.workspaces.forEach(function(w){
    n.appendChild(el("button",{
      class: w.id === S.tab ? "on" : "",
      onclick: function(){
        S.tab = w.id; S.stack = [];
        if(location.hash !== "#" + w.id) history.replaceState(null,"","#" + w.id);
        tabs(); render();
      }
    },[ el("span",{class:"g"},[GLYPH[w.id] || "•"]), w.title ]));
  });
}
function push(title, fn){ S.stack.push({ title: title, fn: fn }); render(); }
function pop(){ S.stack.pop(); render(); }
function render(){
  var back = document.getElementById("back");
  if(S.stack.length){
    var top = S.stack[S.stack.length-1];
    document.getElementById("title").textContent = top.title;
    back.hidden = false; back.onclick = pop;
    return top.fn();
  }
  back.hidden = true;
  var ws = S.me.navigation.workspaces.filter(function(w){ return w.id === S.tab; })[0];
  document.getElementById("title").textContent = ws ? ws.title : "Roncato";
  ({ MY_WORK: myWork, MY_TEAM: myTeam, HR: hrTower, PAYROLL: payroll,
     FINANCE: payroll, MANAGEMENT: management, ADMIN: admin }[S.tab] || myWork)(ws);
}

function moduleGrid(ws){
  var g = el("div",{class:"mods"});
  ws.modules.forEach(function(m){
    var waiting = m.availability !== "AVAILABLE";
    g.appendChild(el("button",{
      class: "mod" + (waiting ? " waiting" : ""),
      onclick: function(){
        if(waiting) return toast(m.detail || "这一块还没连上。");
        openModule(m);
      }
    },[
      el("b",null,[m.title]),
      el("small",null,[ waiting ? (m.detail || "等待中") : "打开" ])
    ]));
  });
  return g;
}

// ── my work ─────────────────────────────────────────────
function myWork(ws){
  skeleton(2);
  Promise.all([ api("GET","/api/my/actions"), api("GET","/api/my/requests") ])
  .then(function(r){
    var actions = r[0].actions || [], mine = r[1].requests || [];
    var v = clear();

    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(actions.length)]), el("span",null,["等我处理"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(mine.length)]), el("span",null,["我提交的"]) ])
    ]));

    if(actions.length){
      v.appendChild(el("h3",{class:"sub"},["等我处理"]));
      actions.forEach(function(a){
        v.appendChild(el("div",{class:"exc"},[
          el("b",null,[ human(a.flow_code) ]),
          el("div",{class:"why"},[ (a.subject || "") + " · " + human(a.state) ]),
          el("button",{class:"btn primary", onclick:function(){
            push("处理", function(){ requestDetail(a.request_id); });
          }},[ a.actions[0].label ])
        ]));
      });
    }

    v.appendChild(el("button",{class:"btn primary", onclick:newRequest},["＋ 新建申请"]));

    if(mine.length){
      v.appendChild(el("h3",{class:"sub",style:"margin-top:16px"},["我提交的"]));
      mine.forEach(function(q){ v.appendChild(requestCard(q)); });
    } else if(!actions.length){
      v.appendChild(el("div",{class:"empty"},[
        el("b",null,["没有待办"]),
        "有申请或需要你回答的事情时会出现在这里。"
      ]));
    }
    v.appendChild(moduleGrid(ws));
  }).catch(fail);
}

function requestCard(q){
  return el("div",{class:"card", onclick:function(){
    push("申请详情", function(){ requestDetail(q.request_id); });
  }},[
    el("div",{class:"rowline"},[
      el("div",null,[
        el("h3",null,[ human(q.flow_code) ]),
        el("div",{class:"sub"},[ q.headline ])
      ]),
      el("span",{class:"pill " + (q.state === "APPROVED" ? "ok"
        : q.state === "REJECTED" || q.state === "CANCELLED" ? "bad"
        : q.overdue ? "warn" : "wait")},[ human(q.state) ])
    ])
  ]);
}

function requestDetail(id){
  skeleton(2);
  api("GET","/api/requests/" + encodeURIComponent(id)).then(function(d){
    var v = clear(), st = d.status;
    v.appendChild(el("div",{class:"card"},[
      el("h3",null,[ human(st.flow_code) ]),
      el("div",{class:"sub"},[ st.headline ]),
      st.overdue ? el("span",{class:"pill warn",style:"margin-top:8px"},["已超时"]) : null
    ]));

    var acts = (d.actions || []);
    var can = acts.filter(function(a){ return a.allowed; });
    var cannot = acts.filter(function(a){ return !a.allowed; });

    can.forEach(function(a){
      v.appendChild(el("button",{
        class: "btn" + (a.event === "APPROVE" || a.event === "DECIDE_SUPERVISOR" ? " primary" : ""),
        onclick: function(){ act(id, a); }
      },[ a.label ]));
    });
    // Shown, not hidden: somebody who expected a button needs to know why it is
    // not theirs, or they refresh the page instead.
    cannot.forEach(function(a){
      v.appendChild(el("button",{class:"btn blocked", disabled:"disabled",
        title:a.reason},[ a.label + " · " + human(a.required_role) ]));
    });

    var tl = el("ul",{class:"tl"});
    (st.history || []).forEach(function(h){
      tl.appendChild(el("li",{class:"done"},[
        el("b",null,[ human(h.event) ]),
        el("span",null,[ (h.actor ? h.actor + " · " : "") + new Date(h.at).toLocaleString() ])
      ]));
    });
    v.appendChild(el("div",{class:"card"},[ el("h3",null,["经过"]), tl ]));
  }).catch(fail);
}

function act(id, a){
  if(S.busy) return;
  var evidence = [];
  if(a.requires_evidence){
    var note = window.prompt("这一步需要写明原因：");
    if(!note) return;
    evidence = [{ kind:"NOTE", ref: note }];
  }
  S.busy = true;
  api("POST","/api/requests/" + encodeURIComponent(id) + "/act", {
    event: a.event, evidence: evidence,
    idempotency_key: id + ":" + a.event + ":" + Date.now()
  }).then(function(d){
    toast(d.replayed ? "这一步刚才已经完成过了。" : "已" + a.label);
    requestDetail(id);
  }).catch(function(e){ toast(e.message || "没有成功"); })
    .then(function(){ S.busy = false; });
}

function newRequest(){
  push("新建申请", function(){
    var v = clear();
    var f = el("form",{onsubmit:function(ev){
      ev.preventDefault();
      var fd = new FormData(f);
      api("POST","/api/requests",{
        flow_code: fd.get("flow"),
        subject: { employee_id: S.me.principal_id, outlet_code: fd.get("outlet") || null },
        context: { note: fd.get("note") || null }
      }).then(function(d){
        toast("已提交");
        S.stack.pop();
        push("申请详情", function(){ requestDetail(d.request_id); });
      }).catch(function(e){ toast(e.message); });
    }},[
      el("label",null,["申请类型"]),
      el("select",{name:"flow"},[
        el("option",{value:"LEAVE_OVERTIME_APPROVAL"},["请假 / 加班"]),
        el("option",{value:"STORE_EXPENSE_CLAIM"},["报销"]),
        el("option",{value:"EMPLOYEE_MASTER_DATA_GOVERNANCE"},["资料变更"])
      ]),
      el("label",null,["门店", el("span",{class:"hint"},["不填就用你主档里的门店"])]),
      el("input",{name:"outlet",placeholder:"ST001",autocapitalize:"characters"}),
      el("label",null,["说明"]),
      el("textarea",{name:"note",placeholder:"简单说一句就够"}),
      el("button",{class:"btn primary",type:"submit"},["提交"])
    ]);
    v.appendChild(f);
  });
}

// ── supervisor ──────────────────────────────────────────
function myTeam(ws){
  skeleton(3);
  Promise.all([ api("GET","/api/team"), api("GET","/api/my/actions") ])
  .then(function(r){
    var t = r[0], actions = r[1].actions || [];
    var v = clear();
    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(t.headcount)]), el("span",null,["在岗"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(actions.length)]), el("span",null,["等我批"]) ]),
      el("div",{class:"c"},[ el("b",null,[String((t.exceptions||[]).length)]), el("span",null,["异常"]) ])
    ]));
    v.appendChild(el("div",{class:"sub",style:"margin-bottom:10px"},
      ["门店 " + (t.outlets || []).join("、")]));

    actions.forEach(function(a){
      v.appendChild(el("div",{class:"exc"},[
        el("b",null,[ human(a.flow_code) ]),
        el("div",{class:"why"},[ (a.subject||"") + " · " + human(a.state) ]),
        el("button",{class:"btn primary",onclick:function(){
          push("处理", function(){ requestDetail(a.request_id); });
        }},[ a.actions[0].label ])
      ]));
    });
    (t.exceptions||[]).forEach(function(x){ v.appendChild(exceptionCard(x)); });

    if(!actions.length && !(t.exceptions||[]).length){
      v.appendChild(el("div",{class:"empty"},[
        el("b",null,["都正常"]), t.headcount + " 位同事没有需要你处理的事。"
      ]));
    }
    v.appendChild(moduleGrid(ws));
  }).catch(fail);
}

function exceptionCard(x){
  return el("div",{class:"exc"},[
    el("b",null,[ x.problem || human(x.code) ]),
    x.why ? el("div",{class:"why"},[ x.why ]) : null,
    el("div",{class:"meta"},[
      x.owner ? el("span",{class:"pill"},[ "负责：" + human(x.owner) ]) : null,
      x.blocks ? el("span",{class:"pill warn"},[ "卡住 " + human(x.blocks) ]) : null
    ]),
    x.required_action ? el("button",{class:"btn",onclick:function(){
      toast(x.required_action);
    }},[ x.required_action ]) : null
  ]);
}

// ── HR ──────────────────────────────────────────────────
function hrTower(ws){
  skeleton(3);
  api("GET","/api/hr/today").then(function(d){
    var v = clear();
    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(d.working_normally)]),
        el("span",null,["一切正常"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(d.exceptions.length)]),
        el("span",null,["需要处理"]) ])
    ]));
    if(!d.exceptions.length){
      v.appendChild(el("div",{class:"empty"},[ el("b",null,["今天没有异常"]) ]));
    }
    d.exceptions.forEach(function(x){ v.appendChild(exceptionCard(x)); });
    v.appendChild(moduleGrid(ws));
  }).catch(fail);
}

// ── payroll ─────────────────────────────────────────────
function payroll(ws){
  skeleton(3);
  api("GET","/api/payroll/readiness").then(function(d){
    var v = clear();
    // Two axes, never merged into one word.
    v.appendChild(el("div",{class:"card"},[
      el("h3",null,["框架"]),
      el("span",{class:"pill ok"},[ human(d.framework_status) ]),
      el("div",{class:"sub",style:"margin-top:8px"},
        ["这一项说的是软件，不是这个月的数据。"])
    ]));
    var p = d.period_readiness;
    v.appendChild(el("div",{class:"card"},[
      el("h3",null,["本期"]),
      el("div",{class:"sub"},[ p.accounted_population + " / " + p.expected_population + " 人已归集" ]),
      el("span",{class:"pill " + (p.attendance_ready ? "ok" : "warn"),style:"margin-top:8px"},
        [ p.attendance_ready ? "考勤齐了" : "考勤未齐" ])
    ]));
    (p.blockers||[]).forEach(function(b){
      v.appendChild(el("div",{class:"exc"},[ el("b",null,[b]) ]));
    });
    Object.keys(d.external||{}).forEach(function(k){
      if(d.external[k] === "CONNECTED") return;
      v.appendChild(el("div",{class:"card"},[
        el("div",{class:"rowline"},[
          el("div",null,[ el("h3",null,[k]),
            el("div",{class:"sub"},["还没有连上，这一块先空着"]) ]),
          el("span",{class:"pill wait"},["等待接入"])
        ])
      ]));
    });
    v.appendChild(moduleGrid(ws));
  }).catch(fail);
}

// ── management ──────────────────────────────────────────
function management(ws){
  skeleton(2);
  api("GET","/api/hr/today").then(function(d){
    var v = clear();
    v.appendChild(el("div",{class:"card"},[
      el("h3",null,["现在"]),
      el("div",{class:"sub"},["这里只放当下和异常。历史趋势在 Power BI。"])
    ]));
    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(d.exceptions.length)]),
        el("span",null,["未处理异常"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(d.working_normally)]),
        el("span",null,["正常"]) ])
    ]));
    d.exceptions.slice(0,5).forEach(function(x){ v.appendChild(exceptionCard(x)); });
    v.appendChild(moduleGrid(ws));
  }).catch(fail);
}

// ── admin ───────────────────────────────────────────────
function admin(ws){
  skeleton(3);
  Promise.all([ api("GET","/api/admin/roles"), api("GET","/api/admin/flows") ])
  .then(function(r){
    var slots = r[0].slots || [], flows = r[1].flows || [];
    var v = clear();
    var open = slots.filter(function(s){ return s.state !== "ASSIGNED"; });

    v.appendChild(el("div",{class:"count"},[
      el("div",{class:"c"},[ el("b",null,[String(open.length)]), el("span",null,["待分配"]) ]),
      el("div",{class:"c"},[ el("b",null,[String(slots.length - open.length)]),
        el("span",null,["已就位"]) ])
    ]));

    open.forEach(function(s){
      v.appendChild(el("div",{class:"exc"},[
        el("b",null,[ s.required_action ]),
        el("div",{class:"why"},[ s.state === "ROLE_SLOT_AMBIGUOUS"
          ? "两个人同时持有，流程会卡住。"
          : "需要这个角色的申请现在没有去处。" ]),
        s.pending_grants.length ? el("div",{class:"meta"},[
          el("span",{class:"pill wait"},[ s.pending_grants.length + " 个待审批" ])
        ]) : null,
        el("button",{class:"btn primary",onclick:function(){ assignForm(s); }},["分配"])
      ]));
    });

    // Policies sit above flow status because an unconfigured rule is something
    // somebody can act on today; flow status is a read-out.
    api("GET","/api/admin/policies").then(function(pol){
      var box = el("div",null,[ el("h3",{class:"sub",style:"margin-top:14px"},["政策"]) ]);
      pol.policies.forEach(function(p){
        box.appendChild(el("div",{class: p.blocks_output ? "exc" : "card"},[
          el("b",null,[ p.title ]),
          el("div",{class:"why"},[ p.status === "UNCONFIGURED"
            ? (p.drafts_waiting ? (p.drafts_waiting + " 个草稿等待审批")
                                : "还没有人定过这条规则")
            : ("第 " + p.version + " 版生效中") ]),
          el("div",{class:"meta"},[
            el("span",{class:"pill"},[ "负责：" + human(p.owner) ]),
            p.decision_ref ? el("span",{class:"pill warn"},[ "待裁决 " + p.decision_ref ]) : null,
            p.blocks_output ? el("span",{class:"pill warn"},["输出被挡住"]) : null
          ]),
          p.required_action ? el("div",{class:"sub"},[ p.required_action ]) : null
        ]));
      });
      // The three things that are somebody's decision, not a defect.
      box.appendChild(el("div",{class:"card"},[
        el("h3",null,["佣金"]),
        el("div",{class:"meta",style:"margin-top:8px"},[
          el("span",{class:"pill ok"},[ "框架 " + human(pol.commission.framework) ]),
          el("span",{class:"pill " + (pol.commission.policy === "CONFIGURED" ? "ok" : "warn")},
            [ "政策 " + human(pol.commission.policy) ]),
          el("span",{class:"pill " + (pol.commission.attribution === "AVAILABLE" ? "ok" : "warn")},
            [ "归属 " + human(pol.commission.attribution) ])
        ]),
        el("div",{class:"sub",style:"margin-top:8px"},[ human(pol.commission.calculation) ]),
        pol.commission.required_action
          ? el("div",{class:"sub"},[ pol.commission.required_action ]) : null
      ]));
      var anchor = v.querySelector("[data-flows]");
      if(anchor) v.insertBefore(box, anchor); else v.appendChild(box);
    }).catch(function(){ /* the board is additive; its absence must not blank admin */ });

    v.appendChild(el("h3",{class:"sub",style:"margin-top:14px","data-flows":"1"},["流程状态"]));
    flows.forEach(function(f){
      v.appendChild(el("div",{class:"card"},[
        el("h3",null,[ human(f.flow) ]),
        el("div",{class:"meta",style:"margin-top:8px"},[
          el("span",{class:"pill " + (f.framework_status === "COMPLETE" ? "ok" : "warn")},
            [ "框架 " + human(f.framework_status) ]),
          el("span",{class:"pill"},[ "配置 " + human(f.config_status) ]),
          el("span",{class:"pill"},[ "覆盖 " + human(f.data_coverage) ]),
          el("span",{class:"pill wait"},[ human(f.live_status) ])
        ])
      ]));
    });
    v.appendChild(moduleGrid(ws));
  }).catch(fail);
}

function assignForm(slot){
  push("分配 " + human(slot.role_code), function(){
    var v = clear();
    v.appendChild(el("div",{class:"sub",style:"margin-bottom:6px"},[
      slot.scope.outlet_code ? ("门店 " + slot.scope.outlet_code) : "全公司"
    ]));
    var f = el("form",{onsubmit:function(ev){
      ev.preventDefault();
      var fd = new FormData(f);
      api("POST","/api/admin/roles",{
        role_code: slot.role_code,
        principal_id: fd.get("who"),
        scope: slot.scope.outlet_code ? { outlet_code: slot.scope.outlet_code }
          : { type:"GLOBAL" },
        effective_from: new Date(fd.get("from")).toISOString(),
        reason: fd.get("reason") || null
      }).then(function(){
        toast("已提交，等别人审批后生效");
        pop();
      }).catch(function(e){ toast(e.message); });
    }},[
      el("label",null,["谁", el("span",{class:"hint"},["员工编号"])]),
      el("input",{name:"who",required:"required",placeholder:"E-1002"}),
      el("label",null,["从哪天起"]),
      el("input",{name:"from",type:"date",required:"required",
        value:new Date().toISOString().slice(0,10)}),
      el("label",null,["原因"]),
      el("input",{name:"reason",placeholder:"新店开业 / 交接"}),
      el("button",{class:"btn primary",type:"submit"},["提交"]),
      el("div",{class:"sub",style:"margin-top:10px"},
        ["提交后不会立刻生效：必须由另一个人审批，你不能批自己提的。"])
    ]);
    v.appendChild(f);
  });
}

function openModule(m){
  push(m.title, function(){
    var v = clear();
    v.appendChild(el("div",{class:"empty"},[
      el("b",null,[m.title]),
      m.flow ? ("这一块属于 " + human(m.flow) + "。") : "",
    ]));
    v.appendChild(el("button",{class:"btn ghost",onclick:pop},["返回"]));
  });
}

boot();
})();
</script>
